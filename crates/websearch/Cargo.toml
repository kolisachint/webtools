[package]
name = "webtools-search"
version = "0.6.0"
edition = "2021"
rust-version = "1.82"
description = "Web search with reference-style URLs: keyless DuckDuckGo, or Brave/Tavily/SearXNG"
license = "MIT"
repository = "https://github.com/kolisachint/webtools"
homepage = "https://github.com/kolisachint/webtools"
readme = "README.md"
keywords = ["search", "llm", "agent", "duckduckgo", "url"]
categories = ["web-programming", "text-processing"]

[lib]
name = "websearch"

[dependencies]
webfetch-core = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
urlencoding = { workspace = true }
once_cell = { workspace = true }
